name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto Android
        run: |
          npm install
          npx cap add android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -q CAMERA android/app/src/main/AndroidManifest.xml
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}
            cp android-icons/$d.png $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:navigationBarColor">#1e1e1e</item>\n        <item name="android:statusBarColor">#1e1e1e</item>' android/app/src/main/res/values/styles.xml
          grep -q navigationBarColor android/app/src/main/res/values/styles.xml
          npx cap sync android
      - name: Compilar
        run: |
          mkdir -p ~/.android && cp android-keystore/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../mi-carrito.apk
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk mi-carrito.apk --title "Mi carrito para Android" --notes "Descarga mi-carrito.apk desde el móvil e instálala."
